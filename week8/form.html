<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>From</title>
    <link rel="stylesheet" href="css/form.css">
</head>

<body>
    <form action="/action_page.php">
        <h2>Registration Form</h2>
        <label for="fname">First name:</label> <br>
        <input type="text" id="fname" name="fname" class="textbox" required><br>

        <label for="lname">Last name:</label><br>
        <input type="text" id="lname" name="lname" class="textbox" required>
        <br>
        <label for="birth">Date of Birth</label><br>
        <input type="date" id="birth" name="birth" required>
        <br>
        <label for="emial">Email Address</label><br>
        <input type="text" id="email" name="email" class="textbox" required>
        <br>
        <label for="url">Home Page URL</label><br>
        <input type="url" id="url" name="url">
        <br>
        <label for="color">Favourite Colors</label><br>
        <select name="color" id="color">
            <option value="green">Green</option>
            <option value="orange">Orange</option>
            <option value="blue">Blue</option>
            <option value="purple">Purple</option>
            <option value="Brown">Brown</option>
            <option value="White">White</option>
        </select>
        <br>
        <p><label for="introduction">Self Introduction</label></p>
        <textarea id="introduction" name="introduction" rows="4" cols="50"></textarea>
        <br>
        <input type="submit" value="submit">
    </form>


</body>

</html>
